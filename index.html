<html lang="id">

  <title>Absensi Guru</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;

    }

    .container {
      max-width: 600px;

    }

    h1 {
      text-align: center;
    }

    .card {

      padding: 20px;

function fbKey(v) {
  return String(v ?? '').trim().replace(/[.#$\/\[\]]/g, '_') || '_';
}
function getLocalDateKey() {
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, '0');
  const d = String(now.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}
function getWibParts() {
  const parts = new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Asia/Jakarta', year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false
  }).formatToParts(new Date());
  const out = {};
  parts.forEach(p => out[p.type] = p.value);
  return out;
}
function todayWIB() {
  const p = getWibParts();
  return `${p.year}-${p.month}-${p.day}`;
}
function timeWIB() {
  const p = getWibParts();
  return `${p.hour}:${p.minute}:${p.second}`;
}
function attendanceKey(idGuru) { return `${todayWIB()}_${idGuru}`; }
function fbError(e) {
  return e?.message || e?.code || String(e || 'Kesalahan Firebase');
}

async function initFirebase() {
  try {
    const [appMod, dbMod, authMod] = await Promise.all([
      import(`https://www.gstatic.com/firebasejs/${FIREBASE_SDK_VERSION}/firebase-app.js`),
      import(`https://www.gstatic.com/firebasejs/${FIREBASE_SDK_VERSION}/firebase-database.js`),
      import(`https://www.gstatic.com/firebasejs/${FIREBASE_SDK_VERSION}/firebase-auth.js`)
    ]);
    const apps = appMod.getApps();
    const app = apps.length ? appMod.getApp() : appMod.initializeApp(firebaseConfig);
    const db = dbMod.getDatabase(app);
    const auth = authMod.getAuth(app);
    firebaseApi = { ...appMod, ...dbMod, ...authMod, app, db, auth };
    await new Promise(resolve => {
      let done = false;
      const stop = authMod.onAuthStateChanged(auth, user => {
        if (!done) { done = true; stop(); resolve(user); }
      });
    });
    return firebaseApi;
  } catch (e) {
    throw new Error('Firebase gagal dimuat: ' + fbError(e));
  }
}

async function fbGet(path) {
  const { ref, get, db } = firebaseApi;
  const snap = await get(ref(db, path));
  return snap.exists() ? snap.val() : null;
}
async function fbSet(path, value) {
  const { ref, set, db } = firebaseApi;
  return set(ref(db, path), value);
}

function showActivation(show, message='') {
  let box = document.getElementById('firebaseActivation');
  if (!box) {
    box = document.createElement('div');
    box.id = 'firebaseActivation';
    box.innerHTML = `
      <div style="position:fixed;inset:0;z-index:99999;background:rgba(15,23,42,.94);display:flex;align-items:center;justify-content:center;padding:20px">
        <div style="width:min(430px,100%);background:white;border-radius:20px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.35)">
          <h2 style="margin:0 0 8px;text-align:center;color:#0f172a">Aktivasi Perangkat</h2>
          <p style="font-size:13px;line-height:1.55;color:#64748b;text-align:center;margin:0 0 18px">Masukkan akun Firebase khusus perangkat absensi satu kali. Setelah berhasil, sesi akan disimpan oleh browser sehingga guru tidak perlu login setiap hari.</p>
          <input id="fbEmail" type="email" autocomplete="username" placeholder="Email akun Firebase perangkat" style="width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;margin-bottom:10px;font-size:14px">
          <input id="fbPassword" type="password" autocomplete="current-password" placeholder="Password" style="width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;margin-bottom:12px;font-size:14px">
          <button id="fbActivateBtn" style="width:100%;padding:13px;border:0;border-radius:10px;background:#2563eb;color:white;font-weight:700;cursor:pointer">AKTIFKAN PERANGKAT</button>
          <div id="fbActivationMsg" style="margin-top:12px;text-align:center;font-size:13px;color:#b91c1c;min-height:18px"></div>
        </div>
      </div>`;
    document.body.appendChild(box);
    document.getElementById('fbActivateBtn').onclick = aktivasiPerangkat;
  }
  box.style.display = show ? 'block' : 'none';
  const msg = document.getElementById('fbActivationMsg');
  if (msg) msg.textContent = message || '';
}

async function aktivasiPerangkat() {
  const email = document.getElementById('fbEmail').value.trim();
  const password = document.getElementById('fbPassword').value;
  const btn = document.getElementById('fbActivateBtn');
  const msg = document.getElementById('fbActivationMsg');
  if (!email || !password) { msg.textContent = 'Email dan password wajib diisi.'; return; }
  btn.disabled = true; btn.textContent = 'MEMVERIFIKASI...'; msg.textContent = '';
  try {
    const cred = await firebaseApi.signInWithEmailAndPassword(firebaseApi.auth, email, password);
    await validasiProfilTerminal(cred.user);
    showActivation(false);
    showStatus('Perangkat terhubung ke Firebase. Scanner siap digunakan.', 'success');
    loadPesanHarian();
  } catch (e) {
    try { await firebaseApi.signOut(firebaseApi.auth); } catch (_) {}
    msg.textContent = 'Aktivasi gagal: ' + fbError(e);
  } finally {
    btn.disabled = false; btn.textContent = 'AKTIFKAN PERANGKAT';
  }
}

async function validasiProfilTerminal(user) {
  const profile = await fbGet(`${USER_PATH}/${fbKey(user.uid)}`);
  if (!profile || profile.active !== true) throw new Error('Akun Firebase tidak aktif atau profil akses belum dibuat.');
  const role = String(profile.role || '').toLowerCase();
  if (role !== 'guru' && role !== 'admin') throw new Error('Akun perangkat harus memiliki role guru atau admin.');
  currentAuthUser = user;
  currentProfile = profile;
  return profile;
}

async function bootstrapAuth() {
  await initFirebase();
  const user = firebaseApi.auth.currentUser;
  if (!user) { showActivation(true); return false; }
  try {
    await validasiProfilTerminal(user);
    showActivation(false);
    return true;
  } catch (e) {
    try { await firebaseApi.signOut(firebaseApi.auth); } catch (_) {}
    showActivation(true, e.message);
    return false;
  }
}

function setMode(pilihan) {
  if (sedangProses) return;
  mode = pilihan;
  document.getElementById('masuk').className = mode === 'MASUK' ? 'mode active' : 'mode';
  document.getElementById('pulang').className = mode === 'PULANG' ? 'mode active' : 'mode';

async function loadPesanHarian() {
  const box = document.getElementById('pesanHarian');
  try {
    box.className = 'loading';
    box.textContent = 'Memuat informasi hari ini...';
    const dateKey = todayWIB();
    const result = await fbGet(`${MESSAGE_PATH}/${dateKey}`);
    if (!result || result.aktif === false) { box.style.display = 'none'; box.className = ''; return; }
    box.innerHTML = ''; box.className = '';
    if (String(result.jenis || 'TEKS').toUpperCase() === 'GAMBAR' && result.urlGambar) {
      box.classList.add('gambar');
      const img = document.createElement('img');
      img.src = result.urlGambar; img.alt = result.isi || 'Informasi hari ini'; img.loading = 'eager';
      img.onerror = () => { box.className = 'loading'; box.textContent = 'Gambar informasi hari ini tidak dapat ditampilkan.'; };
      box.appendChild(img);
      if (result.isi) { const t=document.createElement('div'); t.className='pesan-teks'; t.textContent=result.isi; box.appendChild(t); }
    } else {
      const t=document.createElement('div'); t.className='pesan-teks'; t.textContent=result.isi || ''; box.appendChild(t);
    }
    const tanggal=document.createElement('div'); tanggal.className='pesan-tanggal'; tanggal.textContent='Informasi hari ini'; box.appendChild(tanggal);
    box.style.display='block';
  } catch (e) {
    console.warn('Pesan harian tidak dapat dimuat:', e);
    box.style.display='none'; box.className='';
  }
}

function showStatus(pesan, tipe) {
  const status = document.getElementById('status');
  status.className = tipe; status.textContent = pesan;
}

/* =====================================================
   QR SCANNER — tetap menggunakan pipeline scanner asli
   ===================================================== */
function bersihkanCacheQr() {
  const now = Date.now();
  for (const [id,time] of recentQrSuccess) if (now-time > RECENT_QR_TTL) recentQrSuccess.delete(id);
  for (const [id,data] of qrEvidence) if (now-data.lastAt > QR_EVIDENCE_WINDOW) qrEvidence.delete(id);
}
async function startScanner() {
  if (scanner) { showStatus('Kamera masih aktif dan terus memindai.', 'info'); return; }
  const btnCamera=document.getElementById('btnCamera');
  try {
    btnCamera.disabled=true; document.getElementById('reader').innerHTML='';
    if (!window.isSecureContext) throw new Error('Kamera membutuhkan HTTPS atau koneksi aman.');
    if (!navigator.mediaDevices?.getUserMedia) throw new Error('Browser tidak menyediakan akses kamera.');
    if (!window.jsQR) throw new Error('Pustaka jsQR gagal dimuat.');
    if (!firebaseApi?.auth?.currentUser) throw new Error('Perangkat belum terautentikasi ke Firebase.');
    showStatus('Meminta izin kamera dan menyiapkan scanner...', 'info');
    bukaKunciTTS();
    let permissionStream;
    try {
      permissionStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
      permissionStream.getTracks().forEach(t=>t.stop());
    } catch(e) {
      if (e.name==='NotAllowedError'||e.name==='PermissionDeniedError') throw new Error('Izin kamera ditolak. Izinkan Kamera untuk browser lalu coba lagi.');
      if (e.name==='NotFoundError') throw new Error('Kamera tidak ditemukan pada perangkat.');
      throw e;
    }
    const reader=document.getElementById('reader');
    const video=document.createElement('video');
    video.id='qrVideo'; video.className='qr-video'; video.setAttribute('playsinline','true'); video.autoplay=true; video.muted=true; reader.appendChild(video);
    cameraStream=await bukaKameraJsQR(video); cameraTrack=cameraStream.getVideoTracks()[0]||null;
    scanner={isScanning:true,video}; await tungguVideoAktif(); await optimalkanKamera();
    qrCanvas=document.createElement('canvas'); qrCanvas.width=video.videoWidth||1280; qrCanvas.height=video.videoHeight||720;
    qrCtx=qrCanvas.getContext('2d',{willReadFrequently:true}); scanStartedAt=Date.now(); qrScanRunning=true; qrConsecutiveFailures=0; startJsQrLoop();
    showStatus('Kamera aktif. Arahkan QR Code Guru ke kamera. Scanner terus aktif.','info');
  } catch(e) {
    console.error('Gagal membuka kamera:',e); await bersihkanScanner(); showStatus('Kamera/scanner gagal dibuka: '+fbError(e),'error');
  } finally { btnCamera.disabled=!!scanner; }
}
async function bukaKameraJsQR(video) {
  const constraints={audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30,max:30}}};
  let stream; try { stream=await navigator.mediaDevices.getUserMedia(constraints); } catch(e) { stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}}}); }
  video.srcObject=stream; await video.play(); return stream;
}
async function tungguVideoAktif(){
  const video=document.querySelector('#reader video'); if(!video)return;
  for(let i=0;i<40;i++){ if(video.readyState>=2&&video.videoWidth&&video.videoHeight&&video.srcObject){cameraStream=video.srcObject;const tracks=cameraStream.getVideoTracks();if(tracks.length)cameraTrack=tracks[0];return;} await new Promise(r=>setTimeout(r,100)); }
}
function startJsQrLoop(){if(!qrScanRunning)return;requestAnimationFrame(jsQrFrameLoop);}
async function jsQrFrameLoop(){if(!qrScanRunning)return;const now=performance.now();if(!qrDecodeBusy&&now-(jsQrFrameLoop.lastRun||0)>=QR_DECODE_INTERVAL){jsQrFrameLoop.lastRun=now;try{await decodeQrFrameSuperSensitive();}catch(e){console.warn('Decode QR error:',e);}}requestAnimationFrame(jsQrFrameLoop);}
async function decodeQrFrameSuperSensitive(){
  if(qrDecodeBusy||!cameraTrack||!qrCtx||!window.jsQR)return;
  const video=document.getElementById('qrVideo'); if(!video||video.readyState<2||!video.videoWidth||!video.videoHeight)return;
  qrDecodeBusy=true; qrFrameCounter++; let found=null;
  try{
    const w=video.videoWidth,h=video.videoHeight;
    found=decodeJsQrRegion(video,0,0,w,h,1,false);
    if(!found){const rw=Math.floor(w*.88),rh=Math.floor(h*.88);found=decodeJsQrRegion(video,Math.floor((w-rw)/2),Math.floor((h-rh)/2),rw,rh,1.25,false);}
    if(!found){const rw=Math.floor(w*.68),rh=Math.floor(h*.68);found=decodeJsQrRegion(video,Math.floor((w-rw)/2),Math.floor((h-rh)/2),rw,rh,1.6,false);}
    if(!found){const rw=Math.floor(w*.78),rh=Math.floor(h*.78);found=decodeJsQrRegion(video,Math.floor((w-rw)/2),Math.floor((h-rh)/2),rw,rh,1.35,true);}
    if(found?.data){qrConsecutiveFailures=0;registerQrEvidence(String(found.data).trim());}else{qrConsecutiveFailures++;await recoveryKameraJikaPerlu();}
  }finally{qrDecodeBusy=false;}
}
function decodeJsQrRegion(video,sx,sy,sw,sh,scale,enhance){const width=Math.max(1,Math.floor(sw*scale)),height=Math.max(1,Math.floor(sh*scale));qrCanvas.width=width;qrCanvas.height=height;qrCtx.drawImage(video,sx,sy,sw,sh,0,0,width,height);const image=qrCtx.getImageData(0,0,width,height);if(enhance)enhanceImageData(image);return window.jsQR(image.data,width,height,{inversionAttempts:'attemptBoth'});}
function enhanceImageData(image){const data=image.data;let min=255,max=0;for(let i=0;i<data.length;i+=4){const y=Math.round(.299*data[i]+.587*data[i+1]+.114*data[i+2]);if(y<min)min=y;if(y>max)max=y;}const range=Math.max(1,max-min);for(let i=0;i<data.length;i+=4)for(let c=0;c<3;c++)data[i+c]=Math.max(0,Math.min(255,Math.round((data[i+c]-min)*255/range)));}
function registerQrEvidence(text){if(!text)return;const now=Date.now();bersihkanCacheQr();const current=qrEvidence.get(text);if(!current||now-current.lastAt>QR_EVIDENCE_WINDOW){qrEvidence.set(text,{count:1,firstAt:now,lastAt:now});return;}current.count++;current.lastAt=now;if(current.count>=QR_MIN_EVIDENCE){qrEvidence.delete(text);onScanSuccess(text);}}
async function recoveryKameraJikaPerlu(){if(!cameraTrack||qrConsecutiveFailures<8)return;const now=Date.now();if(now-qrLastRecoveryAt<1500)return;qrLastRecoveryAt=now;try{const cap=cameraTrack.getCapabilities?.()||{};const advanced=[];if(Array.isArray(cap.focusMode)&&cap.focusMode.includes('continuous'))advanced.push({focusMode:'continuous'});if(advanced.length)await cameraTrack.applyConstraints({advanced});}catch(e){console.log('Recovery kamera dilewati:',e);}qrConsecutiveFailures=0;}
async function optimalkanKamera(){
  if(!cameraTrack)return;const capabilities=cameraTrack.getCapabilities?.()||{},settings=cameraTrack.getSettings?.()||{};
  if(capabilities.focusMode){const modes=Array.isArray(capabilities.focusMode)?capabilities.focusMode:[];try{if(modes.includes('continuous'))await cameraTrack.applyConstraints({advanced:[{focusMode:'continuous'}]});else if(modes.includes('single-shot'))await cameraTrack.applyConstraints({advanced:[{focusMode:'single-shot'}]});}catch(e){console.log('Autofocus tidak dapat diterapkan:',e);}}
  if(capabilities.zoom){const min=Number(capabilities.zoom.min),max=Number(capabilities.zoom.max),step=Number(capabilities.zoom.step)||.1;if(Number.isFinite(min)&&Number.isFinite(max)&&max>min){const current=Number(settings.zoom);lastZoom=Number.isFinite(current)?current:min;await applyZoom(clamp(lastZoom,min,Math.min(max,min+Math.max(step*2,(max-min)*.12))));clearInterval(autoZoomTimer);autoZoomTimer=setInterval(async()=>{if(!scanner||!cameraTrack){clearInterval(autoZoomTimer);autoZoomTimer=null;return;}if(sedangProses||Date.now()-scanStartedAt<3000)return;const increment=Math.max(step,(max-min)*.06),next=Math.min(max,Number(lastZoom)+increment);if(next>Number(lastZoom)+.0001)await applyZoom(next);else{clearInterval(autoZoomTimer);autoZoomTimer=null;}},2000);}}
}
async function applyZoom(value){if(!cameraTrack?.getCapabilities)return;const cap=cameraTrack.getCapabilities();if(!cap.zoom)return;const min=Number(cap.zoom.min),max=Number(cap.zoom.max),step=Number(cap.zoom.step)||.1;let zoom=clamp(Number(value),min,max);if(step>0){zoom=min+Math.round((zoom-min)/step)*step;zoom=clamp(zoom,min,max);}try{await cameraTrack.applyConstraints({advanced:[{zoom}]});lastZoom=zoom;}catch(e){console.log('Auto zoom tidak dapat diterapkan:',e);}}
function clamp(value,min,max){return Math.min(Math.max(value,min),max);}

/* =====================================================
   ABSENSI DIRECT FIREBASE
   Hanya point-read guru + point-read attendance hari ini.
   Tidak pernah membaca parent attendance/history.
   ===================================================== */
function hitungJarakMeter(lat1,lng1,lat2,lng2){const R=6371000,toRad=x=>x*Math.PI/180,dLat=toRad(lat2-lat1),dLng=toRad(lng2-lng1);const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;return 2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}
async function bacaGuru(idGuru){const guru=await fbGet(`${TEACHERS_PATH}/${fbKey(idGuru)}`);if(!guru)throw new Error('Guru dengan ID '+idGuru+' tidak ditemukan.');return guru;}
async function bacaAbsensiHariIni(idGuru){return fbGet(`${ATTENDANCE_PATH}/${fbKey(attendanceKey(idGuru))}`);}

async function simpanAbsensiFirebase(idGuru,statusAbsensi,latitude,longitude,guru,jarak){
  const {ref,runTransaction,db}=firebaseApi;
  const key=fbKey(attendanceKey(idGuru));
  const path=`${ATTENDANCE_PATH}/${key}`;
  const tanggal=todayWIB();
  const jam=timeWIB();
  const result=await runTransaction(ref(db,path),current=>{
    const old=current && typeof current==='object' ? current : null;
    if(statusAbsensi==='MASUK'){
      if(old?.jamMasuk) return;
      return {
        ...(old||{}), tanggal, idGuru, nama:String(guru.nama||''), jabatan:String(guru.jabatan||''), mataPelajaran:String(guru.mataPelajaran||''),
        jamMasuk:jam, jamPulang:old?.jamPulang||'', latitude, longitude, jarakMeter:Math.round(jarak), kunciAbsensi:`${tanggal}|${idGuru}`
      };
    }
    if(!old) return;
    if(old.jamPulang) return;
    return {...old,jamPulang:jam,jamPulangLatitude:latitude,jamPulangLongitude:longitude,jamPulangJarakMeter:Math.round(jarak)};
  });
  if(!result.committed) {
    const latest=result.snapshot.exists()?result.snapshot.val():null;
    if(statusAbsensi==='MASUK'&&latest?.jamMasuk)return {success:false,message:`${guru.nama||idGuru} sudah melakukan absensi MASUK pada ${latest.jamMasuk}.`,guru,status:'MASUK',jam:latest.jamMasuk,jarak:latest.jarakMeter};
    if(statusAbsensi==='PULANG'&&!latest)return {success:false,message:`${guru.nama||idGuru} belum melakukan absensi MASUK.`,guru,status:'PULANG'};
    if(statusAbsensi==='PULANG'&&latest?.jamPulang)return {success:false,message:`${guru.nama||idGuru} sudah melakukan absensi PULANG pada ${latest.jamPulang}.`,guru,status:'PULANG',jam:latest.jamPulang,jarak:latest.jamPulangJarakMeter||latest.jarakMeter};
    return {success:false,message:'Absensi tidak dapat diproses karena status berubah. Silakan scan ulang.',guru};
  }
  return {success:true,message:statusAbsensi==='MASUK'?`${guru.nama||idGuru} berhasil absen MASUK.`:`${guru.nama||idGuru} berhasil absen PULANG.`,guru,status:statusAbsensi,jam,jarak:Math.round(jarak)};
}

async function prosesAbsensiDariQR(idGuru,statusAbsensi){
  if(!navigator.geolocation)return {success:false,message:'Perangkat tidak mendukung GPS.'};
  if(!firebaseApi?.auth?.currentUser)return {success:false,message:'Sesi Firebase perangkat belum aktif.'};
  try{
    showStatus('QR '+idGuru+' tervalidasi. Mengambil lokasi GPS...','info');
    const position=await ambilLokasiGPS();
    const lat=position.coords.latitude,lng=position.coords.longitude;
    const jarak=hitungJarakMeter(SCHOOL_LAT,SCHOOL_LNG,lat,lng);
    if(jarak>RADIUS_MAKSIMUM)return {success:false,message:'Absensi ditolak. Anda berada '+Math.round(jarak)+' meter dari sekolah. Radius maksimum adalah '+RADIUS_MAKSIMUM+' meter.',jarak:Math.round(jarak)};
    const guru=await bacaGuru(idGuru);
    const existing=await bacaAbsensiHariIni(idGuru);
    if(statusAbsensi==='MASUK'&&existing?.jamMasuk)return {success:false,message:`${guru.nama||idGuru} sudah melakukan absensi MASUK pada ${existing.jamMasuk}.`,guru,status:'MASUK',jam:existing.jamMasuk,jarak:existing.jarakMeter};
    if(statusAbsensi==='PULANG'&&!existing)return {success:false,message:`${guru.nama||idGuru} belum melakukan absensi MASUK.`,guru,status:'PULANG'};
    if(statusAbsensi==='PULANG'&&existing?.jamPulang)return {success:false,message:`${guru.nama||idGuru} sudah melakukan absensi PULANG pada ${existing.jamPulang}.`,guru,status:'PULANG',jam:existing.jamPulang,jarak:existing.jamPulangJarakMeter||existing.jarakMeter};
    return await simpanAbsensiFirebase(idGuru,statusAbsensi,lat,lng,guru,jarak);
  }catch(e){console.error(e);return {success:false,message:'Gagal memproses absensi: '+fbError(e)};}
}
function ambilLokasiGPS(){return new Promise((resolve,reject)=>navigator.geolocation.getCurrentPosition(resolve,reject,{enableHighAccuracy:true,timeout:10000,maximumAge:5000}));}

async function onScanSuccess(decodedText){
  const idGuru=String(decodedText||'').trim();if(!idGuru)return;bersihkanCacheQr();if(recentQrSuccess.has(idGuru)||sedangProses)return;sedangProses=true;const statusAbsensi=mode;showStatus('QR terbaca. Memproses absensi...','info');
  try{const result=await prosesAbsensiDariQR(idGuru,statusAbsensi);if(result?.success)recentQrSuccess.set(idGuru,Date.now());if(result?.success){const nama=result.guru?.nama||idGuru,jarak=Number.isFinite(Number(result.jarak))?result.jarak:'-';showStatus('ABSENSI BERHASIL\n'+result.message+'\nNama: '+nama+'\nStatus: '+result.status+'\nJam: '+result.jam+'\nJarak: '+jarak+' meter','success');bicara('Absensi '+String(result.status).toLowerCase()+' berhasil untuk '+nama+'.');}else{showStatus(result?.message||'Absensi ditolak.','error');bicara(result?.message||'Absensi ditolak.');}}catch(e){showStatus('Gagal memproses absensi: '+fbError(e),'error');}finally{sedangProses=false;}}

async function bersihkanScanner(){clearInterval(autoZoomTimer);autoZoomTimer=null;qrScanRunning=false;qrDecodeBusy=false;qrEvidence.clear();const activeStream=cameraStream;scanner=null;try{activeStream?.getTracks().forEach(t=>{try{t.stop();}catch(_){}});}finally{cameraTrack=null;cameraStream=null;const reader=document.getElementById('reader');if(reader)reader.innerHTML='';qrCanvas=null;qrCtx=null;}}

function bicara(teks){if(!('speechSynthesis'in window))return false;try{const isi=String(teks||'').trim();if(!isi)return false;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(isi);u.lang='id-ID';u.rate=1;u.pitch=1;u.volume=1;window.speechSynthesis.speak(u);ttsUnlocked=true;return true;}catch(e){return false;}}
function bukaKunciTTS(){if(!('speechSynthesis'in window))return;try{window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('Scanner absensi guru aktif.');u.lang='id-ID';u.volume=1;window.speechSynthesis.speak(u);ttsUnlocked=true;}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&'speechSynthesis'in window){try{window.speechSynthesis.resume();}catch(_){}}});

(async function boot(){
  try{
    showStatus('Menghubungkan ke Firebase...','info');
    const authenticated=await bootstrapAuth();
    if(authenticated){showStatus('Firebase terhubung. Siap untuk scanner.','success');loadPesanHarian();}
  }catch(e){console.error(e);showStatus('Firebase gagal terhubung: '+fbError(e),'error');showActivation(true,'Periksa koneksi internet dan konfigurasi Firebase.');}
})();
</script>
