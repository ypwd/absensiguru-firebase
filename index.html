function getLocalDateKey() {
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, '0');
  const d = String(now.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + d;
}

   MODE ABSENSI
   ===================================================== */
function setMode(pilihan) {
  if (sedangProses) return;
  mode = pilihan;

  document.getElementById('masuk').className =
    mode === 'MASUK' ? 'mode active' : 'mode';

  document.getElementById('pulang').className =
    mode === 'PULANG' ? 'mode active' : 'mode';
}

/* =====================================================
   PESAN / BANNER HARIAN
   ===================================================== */
async function loadPesanHarian() {
  const box = document.getElementById('pesanHarian');

  try {
    box.className = 'loading';
    box.textContent = 'Memuat informasi hari ini...';

    const dateKey = getLocalDateKey();
    const sessionKey = 'absensi_guru_pesan_' + dateKey;
    let result = null;

    try {
      const cached = sessionStorage.getItem(sessionKey);
      if (cached) {
        const parsed = JSON.parse(cached);
        // Jangan gunakan cache error atau cache dari tanggal server yang berbeda.
        if (parsed && parsed.success && parsed.tanggal === dateKey) {
          result = parsed;
        } else if (cached) {
          sessionStorage.removeItem(sessionKey);
        }
      }
    } catch (cacheError) {
      console.log('Cache pesan harian tidak dapat dibaca:', cacheError);
      try { sessionStorage.removeItem(sessionKey); } catch (removeError) {}
    }

    if (!result) {
      await ensureFirebaseReady();

      const messageRef = FirebaseDirect.ref(
        firebaseDb,
        `schools/${SCHOOL_ID}/apps/${APP_ID}/pesanHarian/${dateKey}`
      );
      const snap = await FirebaseDirect.get(messageRef);

      if (snap.exists()) {
        const data = snap.val() || {};
        result = {
          success: true,
          adaPesan: data.aktif !== false,
          tanggal: dateKey,
          jenis: data.jenis || 'TEKS',
          isi: data.isi || '',
          urlGambar: data.urlGambar || ''
        };
      } else {
        result = {
          success: true,
          adaPesan: false,
          tanggal: dateKey
        };
      }

      try {
        sessionStorage.setItem(sessionKey, JSON.stringify(result));
      } catch (cacheError) {
        console.log('Cache pesan harian tidak dapat disimpan:', cacheError);
      }
    }

    if (!result.success || !result.adaPesan) {
      box.style.display = 'none';
      box.className = '';
      return;
    }

    box.innerHTML = '';
    box.className = '';

    if (String(result.jenis).toUpperCase() === 'GAMBAR') {
      box.classList.add('gambar');

      const img = document.createElement('img');
      img.src = result.urlGambar;
      img.alt = result.isi || 'Informasi hari ini';
      img.loading = 'eager';

      img.onerror = function () {
        box.className = 'loading';
        box.textContent =
          'Gambar informasi hari ini tidak dapat ditampilkan.';
      };

      box.appendChild(img);

      if (result.isi) {
        const teks = document.createElement('div');
        teks.className = 'pesan-teks';
        teks.textContent = result.isi;
        box.appendChild(teks);
      }
    } else {
      const teks = document.createElement('div');
      teks.className = 'pesan-teks';
      teks.textContent = result.isi || '';
      box.appendChild(teks);
    }

    if (result.tanggal) {
      const tanggal = document.createElement('div');
      tanggal.className = 'pesan-tanggal';
      tanggal.textContent = 'Informasi hari ini';
      box.appendChild(tanggal);
    }

    box.style.display = 'block';

  } catch (error) {
    console.error('Gagal memuat pesan harian:', error);
    box.style.display = 'none';
    box.className = '';
  }
}

/* =====================================================
   STATUS
   ===================================================== */
function showStatus(pesan, tipe) {
  const status = document.getElementById('status');
  status.className = tipe;
  status.textContent = pesan;
}

/* =====================================================
   QR SCANNER — jsQR + SUPER SENSITIVE PIPELINE
   Decoder diganti dari qr-scanner ke jsQR.
   Lapisan kamera, autofocus, autozoom, continuous scan,
   ROI, upscale, recovery, multi-frame validation dan
   anti-duplikat tetap berada di aplikasi.
   ===================================================== */
let recentQrSuccess = new Map();
const RECENT_QR_TTL = 1800;
const QR_EVIDENCE_WINDOW = 900;
const QR_MIN_EVIDENCE = 2;
const QR_DECODE_INTERVAL = 80;

function bersihkanCacheQr() {
  const now = Date.now();
  for (const [id, time] of recentQrSuccess) {
    if (now - time > RECENT_QR_TTL) recentQrSuccess.delete(id);
  }
  for (const [id, data] of qrEvidence) {
    if (now - data.lastAt > QR_EVIDENCE_WINDOW) qrEvidence.delete(id);
  }
}

async function startScanner() {
  if (scanner) {
    showStatus('Kamera masih aktif dan terus memindai.', 'info');
    return;
  }

  const btnCamera = document.getElementById('btnCamera');

  try {
    btnCamera.disabled = true;
    document.getElementById('reader').innerHTML = '';

    if (!window.isSecureContext) {
      throw new Error('Kamera membutuhkan HTTPS atau koneksi aman.');
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('Browser/WebView tidak menyediakan akses kamera.');
    }
    if (!window.jsQR) {
      throw new Error('Pustaka jsQR gagal dimuat. Periksa koneksi internet.');
    }

    showStatus('Meminta izin kamera dan menyiapkan scanner...', 'info');
    bukaKunciTTS();

    let permissionStream;
    try {
      permissionStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' } },
        audio: false
      });
      permissionStream.getTracks().forEach(track => track.stop());
    } catch (permissionError) {
      const name = permissionError && permissionError.name;
      if (name === 'NotAllowedError' || name === 'PermissionDeniedError') {
        throw new Error('Izin kamera ditolak. Izinkan Kamera untuk browser/aplikasi ini lalu coba lagi.');
      }
      if (name === 'NotFoundError') {
        throw new Error('Kamera tidak ditemukan pada perangkat.');
      }
      throw permissionError;
    }

    const reader = document.getElementById('reader');
    const video = document.createElement('video');
    video.id = 'qrVideo';
    video.className = 'qr-video';
    video.setAttribute('playsinline', 'true');
    video.setAttribute('autoplay', 'true');
    video.setAttribute('muted', 'true');
    video.muted = true;
    reader.appendChild(video);

    cameraStream = await bukaKameraJsQR(video);
    cameraTrack = cameraStream.getVideoTracks()[0] || null;
    scanner = { isScanning: true, video: video };

    await tungguVideoAktif();
    await optimalkanKamera();

    qrCanvas = document.createElement('canvas');
    qrCanvas.width = video.videoWidth || 1280;
    qrCanvas.height = video.videoHeight || 720;
    qrCtx = qrCanvas.getContext('2d', { willReadFrequently: true });

    scanStartedAt = Date.now();
    qrScanRunning = true;
    qrConsecutiveFailures = 0;
    startJsQrLoop();

    showStatus(
      'Kamera aktif. Arahkan QR Code Guru ke kamera. Scanner terus aktif.',
      'info'
    );
  } catch (error) {
    console.error('Gagal membuka kamera:', error);
    await bersihkanScanner();
    showStatus(
      'Kamera/scanner gagal dibuka: ' + (error.message || error),
      'error'
    );
  } finally {
    btnCamera.disabled = !!scanner;
  }
}

async function bukaKameraJsQR(video) {
  const constraints = {
    audio: false,
    video: {
      facingMode: { ideal: 'environment' },
      width: { ideal: 1920 },
      height: { ideal: 1080 },
      frameRate: { ideal: 30, max: 30 }
    }
  };

  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia(constraints);
  } catch (error) {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        width: { ideal: 1280 },
        height: { ideal: 720 },
        frameRate: { ideal: 30 }
      }
    });
  }

  video.srcObject = stream;
  await video.play();
  return stream;
}

async function tungguVideoAktif() {
  const video = document.querySelector('#reader video');
  if (!video) return;

  for (let i = 0; i < 40; i++) {
    if (video.readyState >= 2 && video.videoWidth && video.videoHeight && video.srcObject) {
      cameraStream = video.srcObject;
      const tracks = cameraStream.getVideoTracks();
      if (tracks.length) cameraTrack = tracks[0];
      return;
    }
    await new Promise(resolve => setTimeout(resolve, 100));
  }
}

function startJsQrLoop() {
  if (!qrScanRunning) return;
  requestAnimationFrame(jsQrFrameLoop);
}

async function jsQrFrameLoop() {
  if (!qrScanRunning) return;

  const now = performance.now();
  if (!qrDecodeBusy && now - (jsQrFrameLoop.lastRun || 0) >= QR_DECODE_INTERVAL) {
    jsQrFrameLoop.lastRun = now;
    try {
      await decodeQrFrameSuperSensitive();
    } catch (error) {
      console.warn('Decode QR error:', error);
    }
  }

  requestAnimationFrame(jsQrFrameLoop);
}

async function decodeQrFrameSuperSensitive() {
  if (qrDecodeBusy || !cameraTrack || !qrCtx || !window.jsQR) return;
  const video = document.getElementById('qrVideo');
  if (!video || video.readyState < 2 || !video.videoWidth || !video.videoHeight) return;

  qrDecodeBusy = true;
  qrFrameCounter++;
  let found = null;

  try {
    const w = video.videoWidth;
    const h = video.videoHeight;

    // Pass 1: full frame, native resolution.
    found = decodeJsQrRegion(video, 0, 0, w, h, 1, false);

    // Pass 2: large ROI, modest upscale — membantu QR yang relatif kecil.
    if (!found) {
      const rw = Math.floor(w * 0.88);
      const rh = Math.floor(h * 0.88);
      found = decodeJsQrRegion(
        video,
        Math.floor((w - rw) / 2),
        Math.floor((h - rh) / 2),
        rw,
        rh,
        1.25,
        false
      );
    }

    // Pass 3: center ROI + stronger upscale.
    if (!found) {
      const rw = Math.floor(w * 0.68);
      const rh = Math.floor(h * 0.68);
      found = decodeJsQrRegion(
        video,
        Math.floor((w - rw) / 2),
        Math.floor((h - rh) / 2),
        rw,
        rh,
        1.6,
        false
      );
    }

    // Pass 4: grayscale/contrast recovery.
    if (!found) {
      const rw = Math.floor(w * 0.78);
      const rh = Math.floor(h * 0.78);
      found = decodeJsQrRegion(
        video,
        Math.floor((w - rw) / 2),
        Math.floor((h - rh) / 2),
        rw,
        rh,
        1.35,
        true
      );
    }

    if (found && found.data) {
      qrConsecutiveFailures = 0;
      registerQrEvidence(String(found.data).trim());
    } else {
      qrConsecutiveFailures++;
      await recoveryKameraJikaPerlu();
    }
  } finally {
    qrDecodeBusy = false;
  }
}

function decodeJsQrRegion(video, sx, sy, sw, sh, scale, enhance) {
  const width = Math.max(1, Math.floor(sw * scale));
  const height = Math.max(1, Math.floor(sh * scale));
  qrCanvas.width = width;
  qrCanvas.height = height;

  qrCtx.drawImage(video, sx, sy, sw, sh, 0, 0, width, height);
  const image = qrCtx.getImageData(0, 0, width, height);

  if (enhance) enhanceImageData(image);

  return window.jsQR(image.data, width, height, {
    inversionAttempts: 'attemptBoth'
  });
}

function enhanceImageData(image) {
  const data = image.data;
  let min = 255;
  let max = 0;

  // Kontras global ringan; tidak mengubah warna secara agresif.
  for (let i = 0; i < data.length; i += 4) {
    const y = Math.round(0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]);
    if (y < min) min = y;
    if (y > max) max = y;
  }

  const range = Math.max(1, max - min);
  for (let i = 0; i < data.length; i += 4) {
    for (let c = 0; c < 3; c++) {
      data[i + c] = Math.max(0, Math.min(255,
        Math.round((data[i + c] - min) * 255 / range)
      ));
    }
  }
}

function registerQrEvidence(text) {
  if (!text) return;
  const now = Date.now();
  bersihkanCacheQr();

  const current = qrEvidence.get(text);
  if (!current || now - current.lastAt > QR_EVIDENCE_WINDOW) {
    qrEvidence.set(text, { count: 1, firstAt: now, lastAt: now });
    return;
  }

  current.count += 1;
  current.lastAt = now;

  if (current.count >= QR_MIN_EVIDENCE) {
    qrEvidence.delete(text);
    onScanSuccess(text);
  }
}

async function recoveryKameraJikaPerlu() {
  if (!cameraTrack || qrConsecutiveFailures < 8) return;
  const now = Date.now();
  if (now - qrLastRecoveryAt < 1500) return;
  qrLastRecoveryAt = now;

  try {
    const capabilities = cameraTrack.getCapabilities?.() || {};
    const advanced = [];
    if (Array.isArray(capabilities.focusMode) && capabilities.focusMode.includes('continuous')) {
      advanced.push({ focusMode: 'continuous' });
    }
    if (advanced.length) await cameraTrack.applyConstraints({ advanced });
  } catch (error) {
    console.log('Recovery kamera dilewati:', error);
  }

  qrConsecutiveFailures = 0;
}

async function optimalkanKamera() {
  if (!cameraTrack) return;

  const capabilities =
    typeof cameraTrack.getCapabilities === 'function'
      ? cameraTrack.getCapabilities()
      : {};

  const settings =
    typeof cameraTrack.getSettings === 'function'
      ? cameraTrack.getSettings()
      : {};

  if (capabilities.focusMode) {
    const modes = Array.isArray(capabilities.focusMode)
      ? capabilities.focusMode
      : [];
    try {
      if (modes.includes('continuous')) {
        await cameraTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
      } else if (modes.includes('single-shot')) {
        await cameraTrack.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] });
      }
    } catch (err) {
      console.log('Autofocus tidak dapat diterapkan:', err);
    }
  }

  if (capabilities.zoom) {
    const min = Number(capabilities.zoom.min);
    const max = Number(capabilities.zoom.max);
    const step = Number(capabilities.zoom.step) || 0.1;

    if (Number.isFinite(min) && Number.isFinite(max) && max > min) {
      const current = Number(settings.zoom);
      lastZoom = Number.isFinite(current) ? current : min;

      const startZoom = clamp(
        lastZoom,
        min,
        Math.min(max, min + Math.max(step * 2, (max - min) * 0.12))
      );

      await applyZoom(startZoom);

      clearInterval(autoZoomTimer);
      autoZoomTimer = setInterval(async () => {
        if (!scanner || !cameraTrack) {
          clearInterval(autoZoomTimer);
          autoZoomTimer = null;
          return;
        }
        if (sedangProses) return;
        const elapsed = Date.now() - scanStartedAt;
        if (elapsed < 3000) return;

        const currentZoom = Number(lastZoom);
        const increment = Math.max(step, (max - min) * 0.06);
        const nextZoom = Math.min(max, currentZoom + increment);
        if (nextZoom > currentZoom + 0.0001) {
          await applyZoom(nextZoom);
        } else {
          clearInterval(autoZoomTimer);
          autoZoomTimer = null;
        }
      }, 2000);
    }
  }
}

async function applyZoom(value) {
  if (!cameraTrack || typeof cameraTrack.getCapabilities !== 'function') return;
  const capabilities = cameraTrack.getCapabilities();
  if (!capabilities.zoom) return;

  const min = Number(capabilities.zoom.min);
  const max = Number(capabilities.zoom.max);
  const step = Number(capabilities.zoom.step) || 0.1;
  let zoom = clamp(Number(value), min, max);

  if (step > 0) {
    zoom = min + Math.round((zoom - min) / step) * step;
    zoom = clamp(zoom, min, max);
  }

  try {
    await cameraTrack.applyConstraints({ advanced: [{ zoom }] });
    lastZoom = zoom;
  } catch (err) {
    console.log('Auto zoom tidak dapat diterapkan:', err);
  }
}

function clamp(value, min, max) {
  return Math.min(Math.max(value, min), max);
}

/* =====================================================
   QR BERHASIL DIBACA
   jsQR loop terus aktif. Tidak ada stop() di sini.
   ===================================================== */
async function onScanSuccess(decodedText) {
  const idGuru = String(decodedText || '').trim();
  if (!idGuru) return;

  bersihkanCacheQr();
  if (recentQrSuccess.has(idGuru)) return;
  if (sedangProses) return;

  sedangProses = true;
  const statusAbsensi = mode;

  showStatus('QR terbaca. Mengambil lokasi GPS...', 'info');

  try {
    const result = await prosesAbsensiDariQR(idGuru, statusAbsensi);

    if (result && result.success) recentQrSuccess.set(idGuru, Date.now());

    if (result) {
      if (result.success) {
        const nama = result.guru && result.guru.nama ? result.guru.nama : idGuru;
        const status = result.status || statusAbsensi;
        const jam = result.jam || '-';
        const jarak = Number.isFinite(Number(result.jarak)) ? result.jarak : '-';

        showStatus(
          'ABSENSI BERHASIL\n' + result.message +
          '\nNama: ' + nama + '\nStatus: ' + status +
          '\nJam: ' + jam + '\nJarak: ' + jarak + ' meter',
          'success'
        );

        bicara('Absensi ' + status.toLowerCase() + ' berhasil untuk ' + nama + '.');
      } else {
        showStatus(result.message || 'Absensi ditolak.', 'error');
        bicara(result.message || 'Absensi ditolak.');
      }
    }
  } catch (error) {
    console.error('Kesalahan proses absensi:', error);
    showStatus('Gagal memproses absensi: ' + (error.message || error), 'error');
  } finally {
    sedangProses = false;
  }
}

/* =====================================================
   PROSES ABSENSI DARI QR
   Scanner tetap hidup selama GPS + backend diproses.
   ===================================================== */
async function prosesAbsensiDariQR(idGuru, statusAbsensi) {
  sedangProses = true;

  if (!navigator.geolocation) {
    return {
      success: false,
      message: 'Perangkat tidak mendukung GPS.'
    };
  }

  showStatus(
    'QR ' + idGuru + ' tervalidasi. Mengambil lokasi GPS...',
    'info'
  );

  try {
    const position = await ambilLokasiGPS();

    return await kirimAbsensi(
      idGuru,
      position.coords.latitude,
      position.coords.longitude,
      statusAbsensi
    );
  } catch (error) {
    return {
      success: false,
      message: 'GPS tidak dapat diakses: ' + (error.message || error)
    };
  }
}

/* =====================================================
   AMBIL LOKASI GPS — TIDAK DIUBAH
   ===================================================== */
function ambilLokasiGPS() {
  return new Promise((resolve, reject) => {
    navigator.geolocation.getCurrentPosition(resolve, reject, {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 5000
    });
  });
}

/* =====================================================
   BERSIHKAN SCANNER
   Hanya dipakai saat scanner memang harus ditutup.
   ===================================================== */
async function bersihkanScanner() {
  clearInterval(autoZoomTimer);
  autoZoomTimer = null;
  qrScanRunning = false;
  qrDecodeBusy = false;
  qrEvidence.clear();

  const activeStream = cameraStream;
  scanner = null;

  try {
    if (activeStream) {
      activeStream.getTracks().forEach(track => {
        try { track.stop(); } catch (e) {}
      });
    }
  } finally {
    cameraTrack = null;
    cameraStream = null;
    const reader = document.getElementById('reader');
    if (reader) reader.innerHTML = '';
    qrCanvas = null;
    qrCtx = null;
  }
}

/* =====================================================
   KIRIM KE GOOGLE APPS SCRIPT
   ===================================================== */
async function kirimAbsensi(
  idGuru,
  latitude,
  longitude,
  statusAbsensi
) {
  try {
    await ensureFirebaseReady();

    // 1) Point-read master guru saja. Tidak membaca seluruh teachers.
    // Firebase path keys normally do not contain '/', so use the raw ID when safe.
    const safeIdGuru = String(idGuru).trim();
    const directTeacherRef = FirebaseDirect.ref(
      firebaseDb,
      `schools/${SCHOOL_ID}/shared/teachers/${safeIdGuru}`
    );

    const teacherSnap = await FirebaseDirect.get(directTeacherRef);
    if (!teacherSnap.exists()) {
      return {
        success: false,
        message: 'QR Guru tidak terdaftar: ' + safeIdGuru
      };
    }

    const guru = teacherSnap.val() || {};
    const nama = guru.nama || safeIdGuru;

    // 2) Hitung tanggal/jam WIB dari browser terminal.
    const now = new Date();
    const tanggal = formatWib(now, 'yyyy-MM-dd');
    const jamSekarang = formatWib(now, 'HH:mm:ss');

    // 3) Point-read + transaction hanya pada record hari ini untuk guru tersebut.
    //    Tidak pernah membaca parent attendance/history.
    const attendanceKey = `${tanggal}_${safeIdGuru}`;
    const attendanceRef = FirebaseDirect.ref(
      firebaseDb,
      `schools/${SCHOOL_ID}/apps/${APP_ID}/attendance/${attendanceKey}`
    );

    const jarak = hitungJarakMeter(
      latitude,
      longitude,
      SCHOOL_LAT,
      SCHOOL_LNG
    );

    if (jarak > RADIUS_MAKSIMUM) {
      return {
        success: false,
        message: `Di luar radius absensi. Jarak Anda ${Math.round(jarak)} meter. Maksimal ${RADIUS_MAKSIMUM} meter.`,
        guru,
        jarak: Math.round(jarak)
      };
    }

    const transactionResult = await FirebaseDirect.runTransaction(
      attendanceRef,
      current => {
        if (statusAbsensi === 'MASUK') {
          if (current === null) {
            return {
              tanggal,
              idGuru: safeIdGuru,
              nama,
              jabatan: guru.jabatan || '',
              kelas: guru.kelas || '',
              mataPelajaran: guru.mataPelajaran || '',
              jamMasuk: jamSekarang,
              jamPulang: '',
              latitude,
              longitude,
              jarakMeter: Math.round(jarak),
              kunciAbsensi: attendanceKey
            };
          }

          // Sudah MASUK -> batalkan transaksi tanpa mengubah data.
          return;
        }

        if (statusAbsensi === 'PULANG') {
          if (current === null) {
            return;
          }

          if (current.jamPulang) {
            return;
          }

          if (!current.jamMasuk) {
            return;
          }

          return {
            ...current,
            jamPulang: jamSekarang,
            latitudePulang: latitude,
            longitudePulang: longitude,
            jarakMeterPulang: Math.round(jarak)
          };
        }

        return;
      }
    );

    if (!transactionResult.committed) {
      const finalSnap = await FirebaseDirect.get(attendanceRef);
      const finalData = finalSnap.exists() ? (finalSnap.val() || {}) : null;

      if (statusAbsensi === 'MASUK') {
        if (finalData && finalData.jamMasuk) {
          return {
            success: false,
            message: `Guru sudah melakukan MASUK pada ${finalData.jamMasuk}.`,
            guru,
            status: 'MASUK',
            jam: finalData.jamMasuk,
            jarak: finalData.jarakMeter
          };
        }

        return {
          success: false,
          message: 'Absensi MASUK tidak dapat diproses.',
          guru
        };
      }

      if (statusAbsensi === 'PULANG') {
        if (!finalData) {
          return {
            success: false,
            message: 'Belum ada data MASUK untuk guru ini hari ini.',
            guru
          };
        }

        if (finalData.jamPulang) {
          return {
            success: false,
            message: `Guru sudah melakukan PULANG pada ${finalData.jamPulang}.`,
            guru,
            status: 'PULANG',
            jam: finalData.jamPulang,
            jarak: finalData.jarakMeterPulang
          };
        }

        return {
          success: false,
          message: 'Absensi PULANG tidak dapat diproses.',
          guru
        };
      }
    }

    return {
      success: true,
      message: statusAbsensi === 'MASUK'
        ? 'Absensi MASUK berhasil.'
        : 'Absensi PULANG berhasil.',
      guru,
      status: statusAbsensi,
      jam: jamSekarang,
      jarak: Math.round(jarak)
    };

  } catch (error) {
    console.error('Kesalahan Firebase absensi:', error);

    const code = error && error.code ? error.code : '';
    if (code === 'PERMISSION_DENIED') {
      return {
        success: false,
        message: 'Akses Firebase ditolak. Profil terminal belum aktif atau Rules belum dipasang.'
      };
    }

    return {
      success: false,
      message: 'Gagal memproses absensi: ' + (error.message || error)
    };
  }
}

function hitungJarakMeter(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1 * Math.PI / 180) *
    Math.cos(lat2 * Math.PI / 180) *
    Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function formatWib(date, pattern) {
  const parts = new Intl.DateTimeFormat('en-CA', {
    timeZone: WIB_TIMEZONE,
    year: 'numeric',
    month: '2-digit',
    day: '2-digit',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
    hourCycle: 'h23'
  }).formatToParts(date).reduce((o, p) => {
    o[p.type] = p.value;
    return o;
  }, {});

  if (pattern === 'yyyy-MM-dd') {
    return `${parts.year}-${parts.month}-${parts.day}`;
  }

  return `${parts.hour}:${parts.minute}:${parts.second}`;
}

async function ensureFirebaseReady() {
  if (firebaseApp && firebaseAuth && firebaseDb && currentUser) return;

  if (!window.FirebaseDirect) {
    throw new Error('Firebase SDK belum selesai dimuat.');
  }

  if (!firebaseApp) {
    firebaseApp = FirebaseDirect.initializeApp(FIREBASE_CONFIG);
    firebaseAuth = FirebaseDirect.getAuth(firebaseApp);
    firebaseDb = FirebaseDirect.getDatabase(firebaseApp);
    await FirebaseDirect.setPersistence(
      firebaseAuth,
      FirebaseDirect.browserLocalPersistence
    );
  }

  if (!currentUser) {
    currentUser = firebaseAuth.currentUser;
  }

  if (!currentUser) {
    throw new Error('Terminal belum terautentikasi.');
  }

  await loadTerminalProfile();
}

async function loadTerminalProfile() {
  if (!currentUser) throw new Error('Tidak ada akun Firebase.');

  const profileRef = FirebaseDirect.ref(
    firebaseDb,
    `schools/${SCHOOL_ID}/security/terminalUsers/${currentUser.uid}`
  );
  const snap = await FirebaseDirect.get(profileRef);

  if (!snap.exists()) {
    throw new Error(
      'Akun Firebase belum terdaftar sebagai terminal. Buat profil security/terminalUsers untuk UID ini.'
    );
  }

  terminalProfile = snap.val() || {};

  if (terminalProfile.active !== true) {
    throw new Error('Terminal belum diaktifkan oleh administrator.');
  }
}

async function loginTerminal() {
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const btn = document.getElementById('btnAuth');

  if (!email || !password) {
    showStatus('Email dan password Firebase wajib diisi.', 'error');
    return;
  }

  try {
    btn.disabled = true;
    showStatus('Menghubungkan ke Firebase...', 'info');

    if (!window.FirebaseDirect) {
      throw new Error('Firebase SDK belum selesai dimuat. Tunggu sebentar lalu coba lagi.');
    }

    await tungguFirebaseSDK();

    if (!firebaseApp) {
      firebaseApp = FirebaseDirect.initializeApp(FIREBASE_CONFIG);
      firebaseAuth = FirebaseDirect.getAuth(firebaseApp);
      firebaseDb = FirebaseDirect.getDatabase(firebaseApp);
      await FirebaseDirect.setPersistence(
        firebaseAuth,
        FirebaseDirect.browserLocalPersistence
      );
    }

    const credential = await FirebaseDirect.signInWithEmailAndPassword(
      firebaseAuth,
      email,
      password
    );

    currentUser = credential.user;
    await loadTerminalProfile();

    tampilkanAplikasiUtama();
    showStatus('Terminal berhasil diaktifkan. Scanner siap digunakan.', 'success');
    await loadPesanHarian();

    // Setelah sesi tersimpan, kosongkan password dari field.
    document.getElementById('authPassword').value = '';
  } catch (error) {
    console.error('Login terminal gagal:', error);

    let message = 'Gagal mengaktifkan terminal.';
    if (error && error.code === 'auth/invalid-credential') {
      message = 'Email atau password Firebase tidak benar.';
    } else if (error && error.code === 'auth/too-many-requests') {
      message = 'Terlalu banyak percobaan. Tunggu beberapa saat.';
    } else if (error && error.message) {
      message = error.message;
    }

    showStatus(message, 'error');
  } finally {
    btn.disabled = false;
  }
}

function tampilkanAplikasiUtama() {
  document.getElementById('authPanel').style.display = 'none';
  document.getElementById('appPanel').style.display = 'block';
}

function tampilkanAuthPanel() {
  document.getElementById('authPanel').style.display = 'block';
  document.getElementById('appPanel').style.display = 'none';
}

/* =====================================================
   SUARA / TTS
   Tidak menghalangi scanner.
   ===================================================== */
function bicara(teks) {
  if (!('speechSynthesis' in window)) return false;

  try {
    const isi = String(teks || '').trim();
    if (!isi) return false;

    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(isi);
    utterance.lang = 'id-ID';
    utterance.rate = 1;
    utterance.pitch = 1;
    utterance.volume = 1;
    window.speechSynthesis.speak(utterance);
    ttsUnlocked = true;
    return true;
  } catch (error) {
    console.warn('TTS tidak dapat dijalankan:', error);
    return false;
  }
}

function bukaKunciTTS() {
  if (!('speechSynthesis' in window)) return;

  try {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(
      'Scanner absensi guru aktif.'
    );
    utterance.lang = 'id-ID';
    utterance.rate = 1;
    utterance.pitch = 1;
    utterance.volume = 1;
    window.speechSynthesis.speak(utterance);
    ttsUnlocked = true;
  } catch (error) {
    console.warn('TTS belum dapat diaktifkan:', error);
  }
}

/* =====================================================
   TTS / VISIBILITY
   ===================================================== */
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && 'speechSynthesis' in window) {
    try {
      window.speechSynthesis.resume();
    } catch (error) {
      console.warn('TTS resume tidak dapat dijalankan:', error);
    }
  }
});

/* =====================================================
   INISIALISASI FIREBASE
   Menunggu Firebase module selesai dieksekusi.
   ===================================================== */
function tungguFirebaseSDK(timeoutMs = 10000) {
  return new Promise((resolve, reject) => {
    const mulai = Date.now();

    const cek = () => {
      if (window.FirebaseDirect) {
        resolve(window.FirebaseDirect);
        return;
      }

      if (Date.now() - mulai >= timeoutMs) {
        reject(new Error('Firebase SDK tidak selesai dimuat.'));
        return;
      }

      setTimeout(cek, 50);
    };

    cek();
  });
}

(async function initFirebaseTerminal() {
  try {
    const Firebase = await tungguFirebaseSDK();

    firebaseApp = Firebase.initializeApp(FIREBASE_CONFIG);
    firebaseAuth = Firebase.getAuth(firebaseApp);
    firebaseDb = Firebase.getDatabase(firebaseApp);

    await Firebase.setPersistence(
      firebaseAuth,
      Firebase.browserLocalPersistence
    );

    Firebase.onAuthStateChanged(firebaseAuth, async user => {
      if (!user) {
        currentUser = null;
        terminalProfile = null;
        tampilkanAuthPanel();
        showStatus(
          'Terminal belum terhubung. Aktivasi cukup dilakukan satu kali pada browser ini.',
          'info'
        );
        return;
      }

      try {
        currentUser = user;
        await loadTerminalProfile();
        tampilkanAplikasiUtama();
        await loadPesanHarian();
        showStatus(
          'Terminal terhubung. Scanner siap digunakan.',
          'info'
        );
      } catch (error) {
        console.error('Profil terminal tidak valid:', error);
        currentUser = null;
        terminalProfile = null;
        tampilkanAuthPanel();
        showStatus(
          error.message || 'Profil terminal belum aktif.',
          'error'
        );
      }
    });
  } catch (error) {
    console.error('Inisialisasi Firebase gagal:', error);
    tampilkanAuthPanel();
    showStatus(
      'Firebase belum dapat diinisialisasi: ' + (error.message || error),
      'error'
    );
  }
})();
